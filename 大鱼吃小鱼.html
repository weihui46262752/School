<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🐟 大鱼吃小鱼</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: linear-gradient(to bottom, #87CEEB 0%, #1a73e8 50%, #0d47a1 100%); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            font-family: 'Microsoft YaHei', sans-serif;
            overflow: hidden;
        }
        #gameCanvas { 
            border: 3px solid #fff; 
            border-radius: 12px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            cursor: none;
            display: block;
        }
        #ui { 
            position: absolute; 
            top: 10px; 
            left: 50%; 
            transform: translateX(-50%); 
            color: white; 
            font-size: 18px; 
            font-weight: bold; 
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            display: flex; 
            gap: 30px;
            z-index: 10;
        }
        #gameOver { 
            display: none; 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            background: rgba(255,255,255,0.95); 
            padding: 40px; 
            border-radius: 20px; 
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            z-index: 100;
        }
        #gameOver h1 { color: #ff6b6b; margin-bottom: 20px; }
        #gameOver p { font-size: 20px; color: #333; margin: 10px 0; }
        #gameOver button { 
            margin-top: 20px; 
            padding: 15px 40px; 
            font-size: 18px; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            color: white; 
            border: none; 
            border-radius: 30px; 
            cursor: pointer;
            font-weight: bold;
        }
        #gameOver button:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <div id="ui">
        <span>🐟 分数: <span id="score">0</span></span>
        <span>⚡ 等级: <span id="level">1</span></span>
        <span>❤️ 生命: <span id="lives">❤️❤️❤️</span></span>
    </div>
    <canvas id="gameCanvas"></canvas>
    <div id="gameOver">
        <h1>游戏结束！</h1>
        <p>最终分数: <span id="finalScore">0</span></p>
        <p>最高等级: <span id="finalLevel">1</span></p>
        <button onclick="restartGame()">🔄 再来一局</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // 自适应画布大小
        function resizeCanvas() {
            canvas.width = Math.min(window.innerWidth - 20, 800);
            canvas.height = Math.min(window.innerHeight - 80, 600);
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // 游戏状态
        let score = 0;
        let level = 1;
        let lives = 3;
        let gameRunning = true;
        let mouseX = canvas.width / 2;
        let mouseY = canvas.height / 2;
        let animFrame = 0;

        // 玩家鱼
        const player = {
            x: 100,
            y: 300,
            size: 25,
            speed: 5,
            color: '#FFD700'
        };

        // 鱼群数组
        let fishes = [];
        let bubbles = [];

        // 生成随机数
        function rand(min, max) {
            return Math.random() * (max - min) + min;
        }

        // 绘制鱼
        function drawFish(x, y, size, color, isPlayer = false) {
            ctx.save();
            ctx.translate(x, y);
            
            // 鱼身体
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.ellipse(0, 0, size, size * 0.6, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // 鱼尾巴
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(-size * 0.8, 0);
            ctx.lineTo(-size * 1.3, -size * 0.5);
            ctx.lineTo(-size * 1.3, size * 0.5);
            ctx.closePath();
            ctx.fill();
            
            // 鱼眼睛
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(size * 0.3, -size * 0.2, size * 0.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'black';
            ctx.beginPath();
            ctx.arc(size * 0.35, -size * 0.2, size * 0.1, 0, Math.PI * 2);
            ctx.fill();
            
            // 玩家鱼特效
            if (isPlayer) {
                ctx.strokeStyle = '#FFA500';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.ellipse(0, 0, size + 3, size * 0.6 + 3, 0, 0, Math.PI * 2);
                ctx.stroke();
            }
            
            ctx.restore();
        }

        // 生成鱼
        function spawnFish() {
            const size = rand(10, 40);
            const isDangerous = size > player.size;
            const colors = isDangerous ? 
                ['#ff4444', '#cc0000', '#ff6666'] : 
                ['#44ff44', '#44cc44', '#66ff66', '#ffff44', '#ffaa44'];
            
            return {
                x: canvas.width + 50,
                y: rand(50, canvas.height - 50),
                size: size,
                speed: rand(1, 3),
                color: colors[Math.floor(rand(0, colors.length))],
                direction: -1
            };
        }

        // 生成气泡
        function spawnBubble() {
            return {
                x: rand(0, canvas.width),
                y: canvas.height + 10,
                size: rand(2, 6),
                speed: rand(1, 3)
            };
        }

        // 初始化
        for (let i = 0; i < 15; i++) {
            fishes.push(spawnFish());
        }

        // 鼠标移动
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
        });

        // 触摸移动
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            mouseX = e.touches[0].clientX - rect.left;
            mouseY = e.touches[0].clientY - rect.top;
        });

        // 碰撞检测
        function checkCollision(a, b) {
            const dx = a.x - b.x;
            const dy = a.y - b.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            return distance < a.size + b.size;
        }

        // 游戏结束
        function gameOver() {
            gameRunning = false;
            document.getElementById('finalScore').textContent = score;
            document.getElementById('finalLevel').textContent = level;
            document.getElementById('gameOver').style.display = 'block';
        }

        // 重新开始
        function restartGame() {
            score = 0;
            level = 1;
            lives = 3;
            player.size = 25;
            player.x = 100;
            player.y = 300;
            fishes = [];
            bubbles = [];
            gameRunning = true;
            document.getElementById('gameOver').style.display = 'none';
            document.getElementById('score').textContent = score;
            document.getElementById('level').textContent = level;
            document.getElementById('lives').textContent = '❤️'.repeat(lives);
            for (let i = 0; i < 15; i++) {
                fishes.push(spawnFish());
            }
        }

        // 游戏主循环
        function gameLoop() {
            if (!gameRunning) {
                requestAnimationFrame(gameLoop);
                return;
            }

            animFrame++;
            
            // 清空画布
            ctx.fillStyle = 'rgba(26, 115, 232, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 绘制气泡
            if (animFrame % 10 === 0) {
                bubbles.push(spawnBubble());
            }
            bubbles = bubbles.filter(b => {
                b.y -= b.speed;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
                ctx.fill();
                return b.y > -10;
            });

            // 玩家移动
            const dx = mouseX - player.x;
            const dy = mouseY - player.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            if (distance > 5) {
                player.x += (dx / distance) * Math.min(player.speed, distance);
                player.y += (dy / distance) * Math.min(player.speed, distance);
            }

            // 边界限制
            player.x = Math.max(player.size, Math.min(canvas.width - player.size, player.x));
            player.y = Math.max(player.size, Math.min(canvas.height - player.size, player.y));

            // 绘制玩家
            drawFish(player.x, player.y, player.size, player.color, true);

            // 更新鱼群
            fishes = fishes.filter(fish => {
                fish.x += fish.speed * fish.direction;
                
                // 绘制鱼
                drawFish(fish.x, fish.y, fish.size, fish.color);
                
                // 碰撞检测
                if (checkCollision(player, fish)) {
                    if (fish.size < player.size) {
                        // 吃小鱼
                        score += Math.floor(fish.size);
                        player.size += 0.5;
                        if (score >= level * 100) {
                            level++;
                            player.speed += 0.3;
                            document.getElementById('level').textContent = level;
                        }
                        document.getElementById('score').textContent = score;
                        return false; // 移除被吃的鱼
                    } else {
                        // 被大鱼吃
                        lives--;
                        document.getElementById('lives').textContent = '❤️'.repeat(Math.max(0, lives));
                        if (lives <= 0) {
                            gameOver();
                        }
                        return false; // 移除危险鱼
                    }
                }
                
                // 移除屏幕外的鱼
                return fish.x > -100;
            });

            // 补充鱼群
            if (fishes.length < 10 + level) {
                fishes.push(spawnFish());
            }

            requestAnimationFrame(gameLoop);
        }

        // 启动游戏
        gameLoop();
    </script>
</body>
</html>
