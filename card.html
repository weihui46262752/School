<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>志愿规划分析师 - 个人主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 100%;
            overflow: hidden;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px 20px;
            text-align: center;
            color: white;
            position: relative;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: white;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .name {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .title {
            font-size: 14px;
            opacity: 0.9;
        }

        .content {
            padding: 30px 25px;
        }

        .section {
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 16px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 2px;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tag {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
        }

        .contact-list {
            list-style: none;
        }

        .contact-list li {
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #333;
            font-size: 14px;
        }

        .contact-list li:last-child {
            border-bottom: none;
        }

        .icon {
            width: 35px;
            height: 35px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 16px;
            flex-shrink: 0;
        }

        .footer {
            text-align: center;
            padding: 20px;
            background: #f8f9fa;
            color: #999;
            font-size: 12px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            margin-top: 10px;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: scale(1.02);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <div class="avatar">📚</div>
            <div class="name">志愿规划分析师</div>
            <div class="title">高考志愿填报专家 · 让每一分都有价值</div>
        </div>

        <div class="content">
            <div class="section">
                <div class="section-title">专业技能</div>
                <div class="tags">
                    <span class="tag">高考政策解读</span>
                    <span class="tag">院校分析</span>
                    <span class="tag">专业匹配</span>
                    <span class="tag">职业规划</span>
                    <span class="tag">数据分析</span>
                    <span class="tag">一对一咨询</span>
                </div>
            </div>

            <div class="section">
                <div class="section-title">服务内容</div>
                <ul class="contact-list">
                    <li>
                        <span class="icon">📊</span>
                        <span>一分一段表深度分析</span>
                    </li>
                    <li>
                        <span class="icon">🎯</span>
                        <span>冲稳保志愿方案设计</span>
                    </li>
                    <li>
                        <span class="icon">🔍</span>
                        <span>院校专业组精准匹配</span>
                    </li>
                    <li>
                        <span class="icon">💡</span>
                        <span>职业兴趣与专业推荐</span>
                    </li>
                </ul>
            </div>

            <div class="section">
                <div class="section-title">联系方式</div>
                <ul class="contact-list">
                    <li>
                        <span class="icon">📱</span>
                        <span>微信：weihui2009</span>
                    </li>
                    <li>
                        <span class="icon">📧</span>
                        <span>邮箱：请联系微信获取</span>
                    </li>
                </ul>
            </div>

            <a href="weixin://dl/chat?weihui2009" class="btn">📱 微信联系我</a>
        </div>

        <div class="footer">
            © 2026 志愿规划分析师 · 用心规划每一份未来
        </div>
    </div>
</body>
</html>
